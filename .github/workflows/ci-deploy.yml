name: CI + Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test suite
        run: npm test

  deploy-hook:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy hook
        id: hook
        run: |
          HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          if [ -z "$HOOK" ]; then HOOK="${{ secrets.RENDER_DEPLOY_HOOK }}"; fi
          echo "hook=$HOOK" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy hook
        if: ${{ steps.hook.outputs.hook != '' }}
        run: |
          curl -fsS -X POST "${{ steps.hook.outputs.hook }}"
          echo "Render deploy hook triggered."

      - name: No deploy hook configured
        if: ${{ steps.hook.outputs.hook == '' }}
        run: |
          echo "::error::Set RENDER_DEPLOY_HOOK_URL (or RENDER_DEPLOY_HOOK) in GitHub Actions secrets."
          exit 1

      - name: Verify deployed revision is healthy
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::Set RENDER_HEALTHCHECK_URL to the production /health URL."
            exit 1
          fi
          for attempt in $(seq 1 60); do
            BODY="$(curl -fsS --max-time 10 "$HEALTH_URL" || true)"
            VERSION="$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")"
            if [ "$VERSION" = "$EXPECTED_SHA" ]; then
              echo "Production is healthy at revision $EXPECTED_SHA."
              exit 0
            fi
            echo "Waiting for Render revision ($attempt/60)..."
            sleep 10
          done
          echo "::error::Render did not become healthy at revision $EXPECTED_SHA within 10 minutes."
          exit 1
